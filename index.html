<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cali Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cali Log">
<meta name="theme-color" content="#05070C">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Look: telemetry HUD on deep space black. Glass panels, segmented meters, glowing data lines. Single dark world by design. */
:root {
  --bg: #05070C;
  --bg-2: #0B1020;
  --surface: rgba(18, 24, 40, .62);
  --surface-2: rgba(255, 255, 255, .045);
  --line: rgba(150, 170, 255, .13);
  --line-2: rgba(150, 170, 255, .24);
  --dim: rgba(150, 165, 200, .16);
  --ink: #EEF2FF;
  --muted: #8B94AB;
  --accent: #3D7BFF;
  --accent-2: #8B5CFF;
  --accent-ink: #FFFFFF;
  --glow: rgba(61, 123, 255, .5);
  --ex-pu: #4C8DFF;
  --ex-dip: #B07CFF;
  --ex-push: #2FD8E8;
  --ex-other: #F2C14E;
  --ok: #35E08C; --warn: #FFB547; --bad: #FF4D5E;
  --ok-bg: rgba(53, 224, 140, .1); --warn-bg: rgba(255, 181, 71, .1); --bad-bg: rgba(255, 77, 94, .1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-num: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(75% 45% at 30% -12%, rgba(61, 123, 255, .16), transparent 72%),
    radial-gradient(60% 40% at 80% 45%, rgba(139, 92, 255, .10), transparent 72%),
    radial-gradient(70% 40% at 50% 110%, rgba(47, 216, 232, .08), transparent 70%),
    var(--bg);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: rgba(5, 7, 12, .8); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); z-index: 10; }
.wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 14px; }
header.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding: 14px 0 10px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  background: linear-gradient(180deg, rgba(5, 7, 12, .92) 60%, rgba(5, 7, 12, 0));
}
h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin: 0; display: flex; align-items: center; gap: 10px; }
h1::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--glow), 0 0 2px #fff inset; flex: none; }
h2 { font-size: .78rem; font-weight: 700; margin: 0; letter-spacing: .14em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 1rem; font-weight: 650; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.xs { font-size: .74rem; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .84em; }
.label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card {
  position: relative; display: grid; gap: 12px; min-width: 0; padding: 16px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .012) 40%), var(--surface);
  border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 8px 24px rgba(0, 0, 0, .22);
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: rgba(255, 255, 255, .05); border-radius: 12px; padding: 9px 14px;
  font-weight: 600; min-height: 40px; color: var(--ink); transition: background .15s, box-shadow .15s;
}
.btn:active { background: rgba(255, 255, 255, .1); }
.btn.primary {
  background: linear-gradient(135deg, #3D7BFF, #6B5CFF); color: #fff; border-color: rgba(255, 255, 255, .14);
  box-shadow: 0 6px 22px rgba(61, 123, 255, .38), inset 0 1px 0 rgba(255, 255, 255, .25); font-weight: 700; letter-spacing: .02em;
}
.btn.danger { color: var(--bad); border-color: rgba(255, 77, 94, .45); background: var(--bad-bg); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.sm { padding: 5px 11px; min-height: 32px; font-size: .84rem; border-radius: 10px; }
.btn.block { width: 100%; }
.icon-btn { border: 0; background: transparent; color: var(--muted); font-size: 1.3rem; line-height: 1; padding: 6px 8px; min-height: 36px; }
input[type="text"], input[type="number"], input[type="date"], input[type="password"], select, textarea {
  background: rgba(255, 255, 255, .04); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  width: 100%; min-width: 0; font-size: 16px; color: var(--ink); transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61, 123, 255, .18), 0 0 18px rgba(61, 123, 255, .18); }
input::placeholder, textarea::placeholder { color: rgba(139, 148, 171, .7); }
textarea { min-height: 70px; resize: vertical; }
.field { display: grid; gap: 5px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 10px; font-size: .74rem; font-weight: 700;
  letter-spacing: .04em; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); white-space: nowrap;
}
.chip.ok { color: var(--ok); border-color: rgba(53, 224, 140, .4); background: var(--ok-bg); }
.chip.warn { color: var(--warn); border-color: rgba(255, 181, 71, .4); background: var(--warn-bg); }
.chip.bad { color: var(--bad); border-color: rgba(255, 77, 94, .45); background: var(--bad-bg); }
.sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; box-shadow: 0 0 8px currentColor; }
.empty { text-align: center; padding: 26px 16px; justify-items: center; }
.up { color: var(--ok); } .down { color: var(--bad); } .flat { color: var(--warn); }

/* home */
.hero { padding: 26px 2px 4px; display: grid; gap: 6px; }
h1.hello { font-size: 2.3rem; font-weight: 800; letter-spacing: -.03em; text-transform: none; line-height: 1.05; display: block; color: var(--muted); }
h1.hello::before { display: none; }
h1.hello span { background: linear-gradient(90deg, #FFFFFF, #9DB8FF 55%, #B98CFF); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 1.35em; filter: drop-shadow(0 0 18px rgba(61, 123, 255, .35)); }
.quote { padding: 20px 18px 22px; border-color: rgba(120, 140, 255, .28);
  background: radial-gradient(120% 90% at 0% 0%, rgba(61, 123, 255, .22), transparent 60%), radial-gradient(90% 90% at 100% 100%, rgba(139, 92, 255, .18), transparent 60%), var(--surface);
  box-shadow: 0 0 40px rgba(61, 123, 255, .14), inset 0 1px 0 rgba(255, 255, 255, .08); overflow: hidden; }
.quote::before { content: "\201E"; position: absolute; right: 14px; top: -34px; font-size: 7rem; font-weight: 800; color: rgba(139, 160, 255, .12); line-height: 1; pointer-events: none; }
.quote .q { font-size: 1.28rem; font-weight: 650; line-height: 1.35; letter-spacing: -.01em; text-wrap: balance; }
.todo { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.todo:last-of-type { border-bottom: 0; padding-bottom: 0; }
.todo > div { display: grid; min-width: 0; }
.tick { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 800; color: #04140B; background: var(--ok); box-shadow: 0 0 12px rgba(53, 224, 140, .55); }
.tick.open { background: transparent; border: 1.5px dashed var(--line-2); box-shadow: none; }
.shortcuts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sc { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 8px 12px; display: grid; justify-items: center; gap: 3px; text-align: center; cursor: pointer; color: var(--ink); min-width: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .015)), var(--surface); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07); }
.sc:active { border-color: var(--accent); box-shadow: 0 0 18px rgba(61, 123, 255, .35); }
.sc .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 4px; color: #9DB8FF;
  background: radial-gradient(circle at 50% 30%, rgba(61, 123, 255, .35), rgba(61, 123, 255, .08)); border: 1px solid rgba(120, 150, 255, .3); box-shadow: 0 0 16px rgba(61, 123, 255, .25); }
.sc .ic svg { width: 22px; height: 22px; filter: drop-shadow(0 0 4px rgba(61, 123, 255, .8)); }
.sc b { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
.sc span:last-child { font-size: .7rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

/* HUD */
.hud { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { padding: 12px; gap: 6px; }
.kpi .v { font-family: var(--font-num); font-size: 1.75rem; font-weight: 800; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: .55em; font-weight: 600; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.kpi .s { font-size: .72rem; color: var(--muted); }
.segs { display: flex; gap: 3px; }
.segs i { flex: 1; height: 5px; border-radius: 2px; background: var(--dim); }
.segs i.on { background: var(--accent); box-shadow: 0 0 8px var(--glow); }
.segs i.on.ok { background: var(--ok); box-shadow: 0 0 8px rgba(53, 224, 140, .5); }
@media (max-width: 380px) { .kpi .v { font-size: 1.45rem; } }

/* templates */
.tpls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tpl {
  text-align: left; border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; min-height: 96px;
  background: linear-gradient(160deg, rgba(61, 123, 255, .14), rgba(139, 92, 255, .06) 60%, rgba(255, 255, 255, .02)), var(--surface);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07); color: var(--ink);
}
.tpl b { font-size: .95rem; letter-spacing: .06em; text-transform: uppercase; }
.tpl:active { border-color: var(--accent); box-shadow: 0 0 20px rgba(61, 123, 255, .3); }
.tpl.free { border-style: dashed; background: transparent; }

/* editor */
.block { border-left: 0; overflow: hidden; }
.block::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--bc, var(--accent)); box-shadow: 0 0 12px var(--bc, var(--accent)); }
.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 34px; gap: 6px; align-items: center; }
.set .n { font-size: .78rem; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.set .in { position: relative; }
.set .in input { padding-right: 40px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.set .in span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: .74rem; color: var(--muted); pointer-events: none; text-transform: uppercase; letter-spacing: .06em; }
.last { background: rgba(255, 255, 255, .035); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: .8rem; color: var(--muted); }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 6px; align-items: end; }
.wbox { display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 10px; }
.rgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.rc { border: 1px solid var(--line); background: rgba(255, 255, 255, .04); border-radius: 12px; padding: 6px 0 7px; display: grid; justify-items: center; min-width: 0; color: var(--ink); }
.rc span { font-size: .62rem; color: var(--muted); letter-spacing: .1em; }
.rc b { font-family: var(--font-num); font-size: 1.4rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
.rc.ghost { border-style: dashed; opacity: .55; }
.rc.on { border-color: var(--accent); background: rgba(61, 123, 255, .14); box-shadow: 0 0 16px rgba(61, 123, 255, .35), inset 0 0 0 1px var(--accent); }
.rc.up b { color: var(--ok); text-shadow: 0 0 10px rgba(53, 224, 140, .5); } .rc.dn b { color: var(--bad); text-shadow: 0 0 10px rgba(255, 77, 94, .5); }
.rstep { display: grid; grid-template-columns: 1fr 52px 60px 52px; gap: 8px; align-items: center; }
.rstep .btn { font-size: 1.3rem; padding: 4px 0; }
.rstep .rv { font-size: 1.8rem; font-weight: 800; text-align: center; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: rgba(16, 22, 38, .92); border: 1px solid var(--line-2); color: var(--ink); padding: 11px 16px; border-radius: 14px;
  max-width: min(92vw, 460px); font-size: .9rem; box-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 0 24px rgba(61, 123, 255, .2);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
}

/* history */
.hist-item { display: grid; gap: 6px; }
.hist-line { font-size: .86rem; display: flex; gap: 6px; align-items: baseline; min-width: 0; flex-wrap: wrap; }
.hist-line .mono { overflow-wrap: anywhere; }

/* progress */
.verdict { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.verdict .big { font-family: var(--font-num); font-size: 2.6rem; font-weight: 800; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; text-shadow: 0 0 24px currentColor; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.seg { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255, 255, 255, .03); overflow-x: auto; }
.seg button { flex: 1; white-space: nowrap; border: 0; border-radius: 10px; background: transparent; color: var(--muted); padding: 7px 8px; font-size: .8rem; font-weight: 600; letter-spacing: .03em; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, rgba(61, 123, 255, .9), rgba(107, 92, 255, .9)); color: #fff; box-shadow: 0 0 16px rgba(61, 123, 255, .4); }
.prs { display: grid; gap: 8px; }
.pr { display: flex; justify-content: space-between; gap: 10px; font-size: .88rem; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.pr:last-child { border-bottom: 0; padding-bottom: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: .84rem; }
.tbl td, .tbl th { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th { font-size: .64rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.tbl td.r, .tbl th.r { text-align: right; }

/* coach */
.chat { display: grid; gap: 10px; }
.msg { border-radius: 16px; padding: 11px 13px; max-width: 92%; overflow-wrap: anywhere; font-size: .94rem; }
.msg.user { justify-self: end; background: linear-gradient(135deg, #3D7BFF, #6B5CFF); color: #fff; box-shadow: 0 6px 20px rgba(61, 123, 255, .3); }
.msg.assistant { justify-self: start; background: var(--surface); border: 1px solid var(--line); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.msg.err { justify-self: stretch; background: var(--bad-bg); color: var(--bad); border: 1px solid rgba(255, 77, 94, .45); max-width: 100%; }
.msg ul { margin: 4px 0; padding-left: 18px; }
.msg p + p { margin-top: 6px; }
.composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.composer textarea { min-height: 46px; max-height: 160px; }

/* body */
.bar2 { height: 8px; background: repeating-linear-gradient(90deg, var(--dim) 0 7px, transparent 7px 10px); }
.bar2 i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--ok) 0 7px, transparent 7px 10px); filter: drop-shadow(0 0 5px rgba(53, 224, 140, .6)); }
.goal { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; }
.gauge { width: 100%; max-width: 150px; height: auto; display: block; overflow: visible; }
.goal-side { display: grid; gap: 8px; min-width: 0; }
.goal-side .stat { display: flex; justify-content: space-between; gap: 8px; font-size: .84rem; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.goal-side .stat:last-of-type { border-bottom: 0; }
@media (max-width: 380px) { .goal { grid-template-columns: 120px 1fr; } }
.tip { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.tip .chip { margin-top: 1px; }
.pthumb { width: 56px; height: 56px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line-2); cursor: pointer; }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ptile { border: 0; padding: 0; background: transparent; display: grid; gap: 4px; min-width: 0; color: var(--ink); }
.ptile img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 14px; display: block; max-width: 100%; border: 1px solid var(--line); }
.ptile span { font-size: .7rem; color: var(--muted); letter-spacing: .04em; }
.overlay {
  position: fixed; inset: 0; z-index: 40; background: rgba(5, 7, 12, .96); overflow-y: auto;
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  padding: calc(env(safe-area-inset-top, 0px) + 6px) max(14px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(14px, env(safe-area-inset-left, 0px));
}
.pcomp { display: grid; gap: 8px; max-width: 680px; margin: 0 auto; }
.pcomp.two { grid-template-columns: 1fr 1fr; }
.pcomp figure { margin: 0; display: grid; gap: 4px; min-width: 0; }
.pcomp img { width: 100%; border-radius: 14px; display: block; max-width: 100%; border: 1px solid var(--line); }
.pcomp figcaption { font-size: .78rem; color: var(--muted); text-align: center; letter-spacing: .04em; }

/* tab bar: floating glass dock */
nav.tabs {
  position: fixed; z-index: 20; display: grid; grid-template-columns: repeat(6, 1fr);
  left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  bottom: calc(8px + env(safe-area-inset-bottom, 0px)); max-width: 640px; margin: 0 auto;
  background: rgba(14, 19, 32, .78); border: 1px solid var(--line-2); border-radius: 24px; padding: 6px 4px;
  -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
  box-shadow: 0 12px 40px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08);
}
nav.tabs button { border: 0; background: transparent; padding: 6px 0 5px; display: grid; justify-items: center; gap: 3px; font-size: .6rem; color: var(--muted); font-weight: 700; min-width: 0; letter-spacing: .04em; border-radius: 16px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: #fff; background: rgba(61, 123, 255, .16); }
nav.tabs button[aria-current="page"] svg { color: #7FA8FF; filter: drop-shadow(0 0 6px rgba(61, 123, 255, .9)); }
@media (max-width: 380px) { .quick { grid-template-columns: repeat(3, minmax(0, 1fr)); } .quick .btn { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<nav class="tabs" id="tabs" aria-label="Bereiche"></nav>

<script>
(() => {
"use strict";
const KEY = "cali-log-v1";
const DAY = 86400000;

function parseHealth(txt) {

      if (isFinite(n) && n >= 0 && n < 200000) out.steps = n;

      const n = num(v.replace(/[^\d,.]/g, "")); if (n && n > 30 && n < 250) out.kg = Math.round(n * 10) / 10;
    } else if (k === "kcal") {
      const n = /^\d{1,3}([.,]\d{3})+$/.test(v) ? +v.replace(/[^\d]/g, "") : Math.round(num(v));
      if (isFinite(n) && n > 0 && n < 10000) out.kcal = n;
    }

}

function blockCard(b, i, d) {

  const l0 = lb && lb.b.sets[0];
  const q = ui.quick[i] || { n: b.n || 3, reps: l0 ? l0.reps : "", kg: l0 ? l0.kg || 0 : b.kgDefault || 0 };
  return `<div class="card block" style="--bc:${ex.color}">

    <div class="quick">
      <div class="field"><label class="xs muted" for="q-${i}-n">Sätze/Runden</label><input type="number" inputmode="numeric" id="q-${i}-n" data-q="${i}" data-f="n" value="${q.n}"></div>
      <div class="field"><label class="xs muted" for="q-${i}-r">Wdh.</label><input type="number" inputmode="numeric" id="q-${i}-r" data-q="${i}" data-f="reps" value="${q.reps ?? ""}"></div>
      <div class="field"><label class="xs muted" for="q-${i}-k">kg</label><input type="text" inputmode="decimal" id="q-${i}-k" data-q="${i}" data-f="kg" value="${q.kg ? kgTxt(q.kg) : ""}" placeholder="0"></div>
      <button class="btn sm" data-act="quick" data-b="${i}">Serie eintragen</button>
    </div>

}
function roundInfo(b, lb) {
  const n = b.sets.length || b.n || 10;
  const last = lb ? lb.b.sets.map((s) => s.reps || 0) : null;
  const lastFit = last ? fitLen(last, n) : null;
  return { n, last, lastFit, sug: lastFit ? progressRounds(lastFit) : null, kg: lb && lb.b.sets[0] ? lb.b.sets[0].kg || 0 : b.kgDefault || 0 };
}
function roundsBody(b, i, lb) {
  const R = roundInfo(b, lb), has = b.sets.length > 0;
  const vals = has ? b.sets.map((s) => s.reps ?? 0) : R.sug || [];
  const sel = Math.min(ui.rsel[i] ?? vals.length - 1, vals.length - 1);
  const cells = vals.map((v, k) => {
    const ref = R.last ? R.last[k] : undefined;
    const cmp = has && ref != null ? (v > ref ? " up" : v < ref ? " dn" : "") : "";
    return `<button class="rc${has ? "" : " ghost"}${has && sel === k ? " on" : ""}${cmp}" data-act="r-sel" data-b="${i}" data-k="${k}" aria-label="Runde ${k + 1}: ${v} Wiederholungen"><span>R${k + 1}</span><b>${v}</b></button>`;
  }).join("");
  let ctrl;
  if (has) {
    const tot = sum(vals), lt = R.last ? sum(R.last) : null;
    ctrl = `<div class="rstep"><span class="small">Runde <b>${sel + 1}</b></span>
        <button class="btn" data-act="r-step" data-b="${i}" data-d="-1" aria-label="Runde ${sel + 1} minus 1">−</button>
        <b class="num rv">${vals[sel]}</b>
        <button class="btn" data-act="r-step" data-b="${i}" data-d="1" aria-label="Runde ${sel + 1} plus 1">+</button></div>
      <div class="row"><button class="btn sm" data-act="r-all" data-b="${i}" data-d="-1">Alle −1</button><button class="btn sm" data-act="r-all" data-b="${i}" data-d="1">Alle +1</button>
        <button class="btn sm" data-act="r-rounds" data-b="${i}" data-d="1">+ Runde</button><button class="btn sm" data-act="r-rounds" data-b="${i}" data-d="-1">− Runde</button></div>
      <div class="small">Σ <b class="num" id="sum-${i}">${tot}</b> Wdh. in ${vals.length} Runden${lt != null ? ` · letztes Mal ${lt} <b class="${tot > lt ? "up" : tot < lt ? "down" : "flat"}">(${tot - lt >= 0 ? "+" : ""}${tot - lt})</b>` : ""}</div>`;
  } else if (R.sug) {
    ctrl = `<div class="small">Vorschlag: letztes Mal +1 Wdh. = <b class="num">${sum(R.sug)}</b> Wdh.</div>
      <div class="row"><button class="btn sm primary" data-act="r-take" data-b="${i}" data-mode="sug">Vorschlag übernehmen</button><button class="btn sm" data-act="r-take" data-b="${i}" data-mode="last">Wie letztes Mal</button></div>
      <p class="xs muted">Danach eine Runde antippen und mit − / + anpassen, falls du sie nicht ganz geschafft hast.</p>`;
  } else {
    ctrl = `<div class="quick" style="grid-template-columns:repeat(2,minmax(0,1fr)) auto">
        <div class="field"><label class="xs muted" for="r-${i}-n">Runden</label><input type="number" inputmode="numeric" id="r-${i}-n" value="${R.n}"></div>
        <div class="field"><label class="xs muted" for="r-${i}-r">Wdh. pro Runde</label><input type="number" inputmode="numeric" id="r-${i}-r" placeholder="z. B. 7"></div>
        <button class="btn sm primary" data-act="r-fill" data-b="${i}">Runden füllen</button></div>`;
  }
  return `<div class="rgrid">${cells}</div>${ctrl}`;
}
function wRow(b, i, lb, q) {
  const lastPeak = lb ? Math.max(...lb.b.sets.map((s) => s.reps || 0)) : null;
  const peak = ui.wpeak[i] ?? lastPeak ?? b.peak ?? 4;
  const seq = wPyramid(peak);
  return `<div class="wbox">
    <div class="quick" style="grid-template-columns:repeat(2,minmax(0,1fr)) auto">
      <div class="field"><label class="xs muted" for="w-${i}-p">W-Spitze</label><input type="number" inputmode="numeric" id="w-${i}-p" data-w="${i}" min="1" max="20" value="${peak}"></div>
      <div class="field"><label class="xs muted" for="w-${i}-k">kg</label><input type="text" inputmode="decimal" id="w-${i}-k" value="${q.kg ? kgTxt(q.kg) : ""}" placeholder="0"></div>

  </div>`;
}

function histBody(w) {

function vHist() {
  const ws = sorted().reverse();
  if (!ws.length) return `<header class="bar"><h1>Verlauf</h1><button class="btn ghost sm" data-tab="train">‹ Training</button></header><div class="card empty"><h2>Noch nichts eingetragen</h2><p class="small muted">Gespeicherte Trainings erscheinen hier, neueste zuerst.</p></div>`;
  let lastWeek = null, html = "";
  for (const w of ws) {
    const wk = iso(weekStart(parseISO(w.date)));
    if (wk !== lastWeek) {
      const n = ws.filter((x) => iso(weekStart(parseISO(x.date))) === wk).length;
      html += `<div class="label" style="margin-top:6px">Woche ab ${fmtShort(wk)} · ${n} Einheit${n === 1 ? "" : "en"}</div>`; lastWeek = wk;
    }
    const open = ui.histOpen === w.id;
    html += `<div class="card">
      <button class="between" data-act="hopen" data-id="${w.id}" style="border:0;background:transparent;padding:0;text-align:left;width:100%">
        <span><b>${esc(w.name || "Training")}</b> ${w.sample ? '<span class="chip warn">Beispiel</span>' : ""}<br><span class="small muted">${fmtD(w.date)} · ${sum(w.blocks.map(blockReps))} Wdh.</span></span><span class="muted">${open ? "▲" : "▼"}</span></button>
      ${open ? histBody(w) + `<div class="row">${ui.delAsk === w.id
        ? `<span class="small">Wirklich löschen?</span><button class="btn danger sm" data-act="del-yes" data-id="${w.id}">Löschen</button><button class="btn sm" data-act="del-no">Nein</button>`
        : `<button class="btn sm" data-act="edit" data-id="${w.id}">Bearbeiten</button><button class="btn sm" data-act="dup" data-id="${w.id}">Als neues Training wiederholen</button><button class="btn danger sm" data-act="del" data-id="${w.id}">Löschen</button>`}</div>` : ""}

function chartSVG(pts, tr, color, unit) {
  if (!pts.length) return "";
  const W = 340, H = 190, L = 34, R = 10, T = 12, B = 26;
  const ts = pts.map((p) => parseISO(p.date).getTime());
  let t0 = Math.min(...ts), t1 = Math.max(...ts);
  if (t1 === t0) { t0 -= 3 * DAY; t1 += 3 * DAY; }
  const vs = pts.map((p) => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (tr) { [t0, t1].forEach((t) => { const y = tr.intercept + tr.slope * ((t - ts[0]) / (7 * DAY)); lo = Math.min(lo, y); hi = Math.max(hi, y); }); }
  const span = hi - lo || Math.max(1, hi * 0.2);
  lo = Math.max(0, lo - span * 0.15); hi = hi + span * 0.15;
  const step = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = (t) => L + ((t - t0) / (t1 - t0)) * (W - L - R);
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/>`;
    g += `<text x="${L - 5}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" style="fill:var(--muted)">${nf(v)}</text>`;
  }
  const xl = [pts[0], pts[Math.floor((pts.length - 1) / 2)], pts[pts.length - 1]].filter((p, i, a) => a.indexOf(p) === i);
  xl.forEach((p, i) => { const anchor = xl.length > 1 && i === 0 ? "start" : i === xl.length - 1 && xl.length > 1 ? "end" : "middle";
    g += `<text x="${x(parseISO(p.date).getTime())}" y="${H - 8}" text-anchor="${anchor}" font-size="10" style="fill:var(--muted)">${fmtShort(p.date)}</text>`; });
  const area = `M${x(ts[0])},${y(lo)} ` + pts.map((p, i) => `L${x(ts[i])},${y(p.v)}`).join(" ") + ` L${x(ts[ts.length - 1])},${y(lo)} Z`;
  const gid = "g" + Math.random().toString(36).slice(2, 8);
  g += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.38"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs>`;
  g += `<path d="${area}" fill="url(#${gid})"/>`;
  g += `<polyline points="${pts.map((p, i) => x(ts[i]) + "," + y(p.v)).join(" ")}" fill="none" style="stroke:${color};filter:drop-shadow(0 0 5px ${color})" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (tr && pts.length >= 3) {
    const ya = tr.intercept, yb = tr.intercept + tr.slope * ((ts[ts.length - 1] - ts[0]) / (7 * DAY));
    g += `<line x1="${x(ts[0])}" y1="${y(ya)}" x2="${x(ts[ts.length - 1])}" y2="${y(yb)}" style="stroke:var(--ink);opacity:.55" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  }
  pts.forEach((p, i) => { const last = i === pts.length - 1;
    g += `<circle cx="${x(ts[i])}" cy="${y(p.v)}" r="${last ? 4.5 : 2.8}" style="fill:${last ? "#fff" : "var(--bg)"};stroke:${color}" stroke-width="1.8"><title>${fmtD(p.date)}: ${nf(p.v)} ${unit}</title></circle>`; });
  const lp = pts[pts.length - 1];
  g += `<text x="${Math.min(x(ts[ts.length - 1]), W - R)}" y="${Math.max(T + 8, y(lp.v) - 9)}" text-anchor="end" font-size="11" font-weight="700" style="fill:${color}">${nf(lp.v)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf">${g}</svg><div class="xs muted">Gestrichelt: Trendlinie über den Zeitraum</div>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

function weekChart() {
  const weeks = [];
  const ws0 = weekStart(today());
  for (let i = 7; i >= 0; i--) { const s = new Date(ws0); s.setDate(s.getDate() - i * 7); weeks.push(s); }
  const data = weeks.map((s) => {
    const e = new Date(s); e.setDate(e.getDate() + 7);
    const wk = S.workouts.filter((w) => { const d = parseISO(w.date); return d >= s && d < e; });
    const per = {}; S.exercises.forEach((x) => (per[x.id] = 0));
    wk.forEach((w) => w.blocks.forEach((b) => { per[b.ex] = (per[b.ex] || 0) + blockReps(b); }));
    return { s, per, n: wk.length, tot: sum(Object.values(per)) };
  });
  const max = Math.max(10, ...data.map((d) => d.tot));
  const W = 340, H = 150, L = 6, R = 6, T = 14, B = 30;
  const bw = (W - L - R) / data.length;
  let g = "";
  data.forEach((d, i) => {
    let yy = H - B; const x0 = L + i * bw + bw * 0.18, w = bw * 0.64;
    S.exercises.forEach((e) => { const v = d.per[e.id] || 0; if (!v) return; const h = (v / max) * (H - T - B); yy -= h;
      g += `<rect x="${x0}" y="${yy}" width="${w}" height="${Math.max(0, h - 1)}" rx="2" style="fill:${e.color};filter:drop-shadow(0 0 4px ${e.color})"><title>${e.name}: ${v}</title></rect>`; });
    if (d.tot) g += `<text x="${x0 + w / 2}" y="${yy - 3}" text-anchor="middle" font-size="9.5" style="fill:var(--muted)">${d.tot}</text>`;
    g += `<text x="${x0 + w / 2}" y="${H - 16}" text-anchor="middle" font-size="9.5" style="fill:var(--muted)">${fmtShort(iso(d.s))}</text>`;
    g += `<text x="${x0 + w / 2}" y="${H - 4}" text-anchor="middle" font-size="9.5" font-weight="700" style="fill:${d.n >= 3 ? "var(--ok)" : d.n ? "var(--warn)" : "var(--muted)"}">${d.n}×</text>`;
  });
  g += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" style="stroke:var(--line)"/>`;
  const legend = S.exercises.map((e) => `<span class="row xs" style="gap:4px"><span class="sw" style="background:${e.color}"></span>${esc(e.name)}</span>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wochenvolumen">${g}</svg></div><div class="row" style="gap:12px">${legend}</div>`;
}

const SYSTEM = `Du bist der Trainings-Coach in der App "Cali Log" eines Calisthenics-Sportlers (Klimmzüge, Dips, Liegestütze, teils mit Zusatzgewicht). Antworte immer auf Deutsch, direkt und knapp, ohne Floskeln. Sei ehrlich und kritisch: benenne Stagnation, ausgelassene Einheiten und fehlende Progression klar. Stütze jede Aussage auf die mitgelieferten Daten und nenne konkrete Zahlen; wenn Daten fehlen oder zu wenige Einheiten vorliegen, sag das statt zu raten. Mach keine Leistungsversprechen. Bei Schmerzen oder Verletzungsverdacht: Belastung reduzieren und ärztlich abklären lassen. Beispieldaten sind keine echten Leistungen. Formatiere mit kurzen Absätzen und höchstens einer kurzen Liste.

function md(s) {
  const lines = esc(s).split("\n"); let out = "", inList = false;
  for (let l of lines) {
    l = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, '<span class="mono">$1</span>');
    const li = /^\s*(?:[-*•]|\d+\.)\s+(.*)$/.exec(l);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + li[1] + "</li>"; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    const h = /^#{1,4}\s+(.*)$/.exec(l);
    if (h) { out += "<p><b>" + h[1] + "</b></p>"; continue; }
    if (l.trim()) out += "<p>" + l + "</p>";
  }
  if (inList) out += "</ul>";
  return out;
}

async function ask(q) {
  if (!q.trim() || ui.busy) return;
  S.chat.push({ role: "user", content: q.trim() }); ui.coachDraft = ""; ui.busy = true; save(true); render();
  const history = S.chat.filter((m) => m.role === "user" || m.role === "assistant").slice(-12);
  while (history.length && history[0].role !== "user") history.shift();
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": S.settings.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: S.settings.model, max_tokens: 1500, system: SYSTEM + "\n\n<daten>\n" + buildContext() + "\n</daten>", messages: history.map((m) => ({ role: m.role, content: m.content })) }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const msg = res.status === 401 ? "API-Key ungültig. Bitte unter Mehr prüfen." : res.status === 429 ? "Zu viele Anfragen oder Limit erreicht. Kurz warten." :
        res.status === 529 || res.status >= 500 ? "Claude ist gerade überlastet. Gleich nochmal versuchen." : (data.error && data.error.message) || "Fehler " + res.status;
      S.chat.push({ role: "err", content: msg });
    } else {
      const text = (data.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n").trim();
      S.chat.push({ role: "assistant", content: text || "(keine Antwort)" });
    }
  } catch (e) {
    S.chat.push({ role: "err", content: "Keine Verbindung. Der Coach braucht Internet, alles andere funktioniert offline." });
  }
  if (S.chat.length > 60) S.chat = S.chat.slice(-60);
  ui.busy = false; save(true); if (tab === "coach") render();
}

const PH = (() => {

    r.onupgradeneeded = () => r.result.createObjectStore("p");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

  const tx = (mode, fn) => open().then((db) => new Promise((res, rej) => {
    const t = db.transaction("p", mode); const req = fn(t.objectStore("p"));
    t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error);
  }));
  return {
    get: (k) => tx("readonly", (s) => s.get(k)), put: (k, v) => tx("readwrite", (s) => s.put(v, k)),
    del: (k) => tx("readwrite", (s) => s.delete(k)), keys: () => tx("readonly", (s) => s.getAllKeys()), clear: () => tx("readwrite", (s) => s.clear()),
  };
})();

async function compress(file, max, q) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", q);
  } finally { URL.revokeObjectURL(url); }
}

function bodyStats() {

  pts.forEach((p) => { const w = pts.filter((q) => q.t <= p.t && q.t > p.t - 7 * DAY); p.avg = sum(w.map((q) => q.kg)) / w.length; });
  let reg = null;
  if (pts.length) {
    const lastT = pts[pts.length - 1].t;

    const span = (win[win.length - 1].t - win[0].t) / DAY;

const r50 = (v) => Math.round(v / 50) * 50;
function bodyPlan(st) {

    if (out.pct > 1) tips.push(["bad", `Für ${nf(g.kg)} kg bis ${fmtShort(g.date)} bräuchtest du ${nf(out.needWk, 2)} kg pro Woche, das sind über 1 % deines Gewichts. So schnell geht meist Muskulatur und Kraft mit verloren. Realistischer wären 0,5–0,7 % pro Woche.`]);
    if (out.onTrack) tips.push(["ok", `Du liegst im Plan: Trend ${nf(wk, 2)} kg/Woche, nötig sind ${nf(-out.needWk, 2)} kg/Woche. So weitermachen.`]);
    else {

      } else tips.push(["info", "Trag zwei Wochen lang deine Kalorien abgewogen ein. Dann rechnet die App aus Gewichtstrend und Essen deinen echten Erhaltungsbedarf aus und sagt dir eine konkrete Kalorienzahl."]);
    }

  if (wk > 0.1) tips.unshift(["bad", `Der Trend steigt um ${nf(wk, 2)} kg pro Woche. Das entspricht grob ${r50(surplus)} kcal pro Tag über deinem Bedarf. Prüf die letzten Tage auf Extras wie Öl, Getränke, Snacks oder das Wochenende.`]);

}

function gauge(pct, big, sub) {
  const N = 46, cx = 75, cy = 72, R1 = 56, R2 = 67;

    const f = i / (N - 1), a = ((135 + 270 * f) * Math.PI) / 180;
    const l = `<line x1="${(cx + R1 * Math.cos(a)).toFixed(1)}" y1="${(cy + R1 * Math.sin(a)).toFixed(1)}" x2="${(cx + R2 * Math.cos(a)).toFixed(1)}" y2="${(cy + R2 * Math.sin(a)).toFixed(1)}"`;
    if (pct > 0 && f <= pct / 100) on += l + ` style="stroke:var(--ok)" stroke-width="3.2" stroke-linecap="round"/>`;
    else off += l + ` style="stroke:var(--dim)" stroke-width="3" stroke-linecap="round"/>`;
  }
  return `<svg class="gauge" viewBox="0 0 150 140" role="img" aria-label="${Math.round(pct)} Prozent des Ziels">
    ${off}<g style="filter:drop-shadow(0 0 4px rgba(53,224,140,.75))">${on}</g>
    <text x="${cx}" y="${cy + 6}" text-anchor="middle" font-size="30" font-weight="800" letter-spacing="-1" style="fill:var(--ink)">${big}</text>
    <text x="${cx}" y="${cy + 24}" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1.4" style="fill:var(--muted)">${sub.toUpperCase()}</text>
    <text x="${cx}" y="${cy + 62}" text-anchor="middle" font-size="12" font-weight="800" style="fill:var(--ok)">${Math.round(pct)} %</text>
  </svg>`;
}

function weightChart(st) {
  const g = S.body.goal;
  if (!st.pts.length) return `<p class="small muted" style="padding:20px 0;text-align:center">Noch keine Einträge</p>`;
  const now = today().getTime();
  const lastT = st.pts[st.pts.length - 1].t;
  const from = ui.brange === "all" ? st.pts[0].t : Math.min(lastT, now) - (+ui.brange) * DAY;
  const pts = st.pts.filter((p) => p.t >= from);
  const gT = parseISO(g.date) ? parseISO(g.date).getTime() : null;
  let to = Math.max(lastT, now);
  if (st.reg) to = gT && gT > to && gT - to < 150 * DAY ? gT : to + 56 * DAY;
  const t0 = pts.length ? pts[0].t : from;
  const fx = st.reg ? [[Math.max(lastT, t0), st.at(Math.max(lastT, t0))], [to, st.at(to)]] : [];
  const ys = pts.map((p) => p.kg).concat(fx.map((f) => f[1]), [g.kg]);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  lo = Math.floor(lo - 0.5); hi = Math.ceil(hi + 0.5);
  const W = 340, H = 210, L = 30, R = 8, T = 10, B = 24;
  const x = (t) => L + ((t - t0) / Math.max(DAY, to - t0)) * (W - L - R);
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const step = niceStep((hi - lo) / 4);
  let s = "";
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) {
    s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L - 4}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" style="fill:var(--muted)">${nf(v)}</text>`;
  }
  if (now >= t0 && now <= to) s += `<line x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${H - B}" style="stroke:var(--muted)" stroke-dasharray="2 3" opacity=".6"/><text x="${x(now)}" y="${H - B + 20}" text-anchor="middle" font-size="9.5" style="fill:var(--muted)">heute</text>`;
  [t0, to].forEach((t, i) => (s += `<text x="${x(t)}" y="${H - 6}" text-anchor="${i ? "end" : "start"}" font-size="10" style="fill:var(--muted)">${fmtShort(iso(new Date(t)))}</text>`));
  s += `<line x1="${L}" x2="${W - R}" y1="${y(g.kg)}" y2="${y(g.kg)}" style="stroke:var(--ok)" stroke-width="1" opacity=".7"/><text x="${L + 4}" y="${y(g.kg) - 4}" font-size="10" font-weight="700" style="fill:var(--ok)">Ziel ${nf(g.kg)}</text>`;
  if (gT && gT >= t0 && gT <= to) s += `<circle cx="${x(gT)}" cy="${y(g.kg)}" r="4" style="fill:var(--ok)"/>`;
  pts.forEach((p) => (s += `<circle cx="${x(p.t)}" cy="${y(p.kg)}" r="2.6" style="fill:var(--muted)" opacity=".45"><title>${fmtD(p.d)}: ${nf(p.kg)} kg</title></circle>`));
  if (pts.length > 1) {
    s += `<defs><linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>`;
    s += `<path d="M${x(pts[0].t)},${y(lo)} ${pts.map((p) => "L" + x(p.t) + "," + y(p.avg)).join(" ")} L${x(pts[pts.length - 1].t)},${y(lo)} Z" fill="url(#wgrad)"/>`;
    s += `<polyline points="${pts.map((p) => x(p.t) + "," + y(p.avg)).join(" ")}" fill="none" style="stroke:var(--accent);filter:drop-shadow(0 0 6px var(--accent))" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  if (st.reg) {
    s += `<line x1="${x(fx[0][0])}" y1="${y(fx[0][1])}" x2="${x(fx[1][0])}" y2="${y(fx[1][1])}" style="stroke:var(--accent)" stroke-width="2" stroke-dasharray="6 5" opacity=".8"/>`;
    s += `<text x="${x(fx[1][0]) - 2}" y="${y(fx[1][1]) + (fx[1][1] > g.kg ? -6 : 14)}" text-anchor="end" font-size="10.5" font-weight="700" style="fill:var(--accent)">${nf(fx[1][1])}</text>`;
    if (gT && gT > lastT && st.cur > g.kg) s += `<line x1="${x(lastT)}" y1="${y(st.cur)}" x2="${x(gT)}" y2="${y(g.kg)}" style="stroke:var(--ok)" stroke-width="1.6" stroke-dasharray="1.5 4" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf mit Prognose">${s}</svg>`;
}

function startDraft(tplId, date) {
  const t = S.templates.find((x) => x.id === tplId);
  S.draft = { id: uid(), tpl: tplId || null, name: t ? t.name : "Freies Training", date: date || iso(today()), bw: null, rpe: null, note: "",
    blocks: t ? t.blocks.map((b) => ({ ex: b.ex, label: b.label || "", n: b.n || 3, peak: b.peak || null, kgDefault: b.kg || 0, sets: [] })) : [] };
  ui.quick = {}; ui.wpeak = {}; ui.rsel = {}; ui.addEx = !t; ui.discardAsk = false;
}
function sampleData() {
  const out = []; const bw = 78; const start = new Date(today().getTime() - 8 * 7 * DAY);
  const ws = weekStart(start);
  for (let w = 0; w < 8; w++) {
    const mo = new Date(ws); mo.setDate(mo.getDate() + w * 7);
    const mk = (offset, tpl, name, blocks) => { const d = new Date(mo); d.setDate(d.getDate() + offset); if (d >= today()) return;
      out.push({ id: uid(), sample: true, tpl, name, date: iso(d), bw, rpe: 7, note: "", created: d.getTime(), blocks }); };
    const rep = (n, r, kg = 0) => Array.from({ length: n }, () => ({ reps: r, kg }));
    mk(0, "mo", "Mo · EMOM", [{ ex: "pu", label: "EMOM", sets: rep(10, 4 + Math.floor(w / 3)) }, { ex: "dip", label: "EMOM", sets: rep(10, 6 + Math.floor(w / 3)) }, { ex: "push", label: "EMOM", sets: rep(10, 10 + Math.floor(w / 2)) }]);
    if (w % 2 === 0) mk(2, "mi", "Mi · Zirkel", [{ ex: "pu", label: "Zirkel", sets: rep(10, 5) }, { ex: "dip", label: "Zirkel", sets: rep(10, 8) }, { ex: "push", label: "Zirkel", sets: rep(10, 12) }]);
    const kgP = 15 + (w >= 5 ? 2.5 : 0);
    mk(4, "fr", "Fr · Schwer", [
      { ex: "pu", label: "Gewichtet", sets: [{ reps: 5 + (w >= 3 && w < 5 ? 1 : 0), kg: kgP }, { reps: 4 + (w >= 2 ? 1 : 0), kg: kgP }, { reps: 4, kg: kgP }] },
      { ex: "dip", label: "Gewichtet", sets: [{ reps: 8, kg: 25 }, { reps: 7, kg: 25 }, { reps: 6 + (w >= 4 ? 1 : 0), kg: 25 }] },
      { ex: "pu", label: "W-Pyramide", sets: wPyramid(w >= 6 ? 5 : 4).map((r) => ({ reps: r, kg: 0 })) }, { ex: "dip", label: "W-Pyramide", sets: wPyramid(6).map((r) => ({ reps: r, kg: 0 })) }]);
  }
  return out;
}
async function exportBackup() {
  const photos = {};
  try { for (const k of await PH.keys()) photos[k] = await PH.get(k); } catch (e) {}
  const json = JSON.stringify({ app: "cali-log", exported: new Date().toISOString(), data: { ...S, settings: { ...S.settings, apiKey: "" } }, photos });
  const name = "cali-log-backup-" + iso(today()) + ".json";
  const file = new File([json], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

      else if (act === "r-rounds") {

    case "wfill": {

      try {
        const j = JSON.parse(r.result); const data = j.data || j;
        if (!Array.isArray(data.workouts)) throw new Error("format");
        const key = S.settings.apiKey;
        S = Object.assign(fresh(), data); S.settings = Object.assign(fresh().settings, data.settings || {}); if (!S.settings.apiKey) S.settings.apiKey = key;
        S.body = Object.assign(fresh().body, data.body || {});
        save(true);
        const ph = j.photos || {};
        (Object.keys(ph).length ? PH.clear().then(() => Promise.all(Object.entries(ph).map(([k, v]) => PH.put(k, v)))) : Promise.resolve())
          .then(() => { for (const k in thumbs) delete thumbs[k]; return loadThumbs(); }).catch(() => {});
        toast("Backup importiert: " + S.workouts.length + " Einheiten, " + Object.keys(S.body.entries).length + " Gewichtseinträge."); render();
      } catch (e) { toast("Datei ist kein gültiges Cali-Log-Backup."); }
    };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.target.id === "c-in" && ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); ask(ev.target.value); }
});
window.addEventListener("pagehide", () => save(true));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(true); });

if (S.draft) tab = "train";
render();
loadThumbs();

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
// test hook
window.__cali = { parseHealth, metricOf, trend, series, detectPRs, sampleData, get S() { return S; } };
})();
